{% extends "quiz/base.html" %}

{% block title %}Create Exam{% endblock %}

{% block content %}
<h1 class="mb-4">Create New Exam</h1>

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger">
                            {% for error in field.errors %}
                                <small>{{ error }}</small>
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Create Exam</button>
            <a href="{% url 'quiz:exam_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
